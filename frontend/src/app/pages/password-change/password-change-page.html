<section class="profile-form-page section-shell">
  <a class="back-link" routerLink="/perfil">← Voltar ao perfil</a>
  <div class="account-form-card">
    <p class="section-kicker">Segurança</p>
    <h1>Alterar senha</h1>
    @if (canChangePassword()) {
      <p>Defina uma nova senha para a sua conta por e-mail.</p>
      <label class="form-field"
        >Nova senha<input
          type="password"
          minlength="8"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
          autocomplete="new-password"
      /></label>
      <label class="form-field"
        >Confirmar nova senha<input
          type="password"
          minlength="8"
          [ngModel]="confirmation()"
          (ngModelChange)="confirmation.set($event)"
          autocomplete="new-password"
      /></label>
      @if (error()) {
        <p class="form-error">{{ error() }}</p>
      }
      @if (success()) {
        <p class="form-success">{{ success() }}</p>
      }
      <button class="button button--primary" type="button" (click)="save()">Atualizar senha</button>
    } @else {
      <p>Esta conta usa login social. A senha é administrada pelo seu provedor de identidade.</p>
    }
  </div>
</section>
